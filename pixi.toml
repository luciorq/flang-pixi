#
# flang-pixi — workspace root
#
# This manifest is NOT a package. It is the developer workspace: it provides the
# tools (pixi/rattler-build/zig probes) and the task graph that drives the three
# package manifests under `packages/`.
#
# Each package under `packages/<name>/pixi.toml` is its own pixi package with its
# own `recipe/recipe.yaml`, built via `pixi build --path packages/<name>`.
#
# See docs/ for the full design. Start with docs/README.md.
#

[workspace]
name = "flang-pixi"
version = "0.1.0"
authors = ["luciorq <luciorqueiroz@gmail.com>"]
description = "Build LLVM Flang for linux/macOS/Windows with the conda-forge zig toolchain, packaged with pixi + rattler-build"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64", "win-arm64"]
preview = ["pixi-build"]

# ---------------------------------------------------------------------------
# Developer tools. These are NOT the build dependencies of the packages —
# those live in each recipe's `requirements:` block (the recipe is the source
# of truth for binary dependencies when using pixi-build-rattler-build).
# ---------------------------------------------------------------------------
[dependencies]
rattler-build = ">=0.76"
python = ">=3.12"

# ---------------------------------------------------------------------------
# `zig-probe` env: stage 0. A minimal environment holding just the conda-forge
# zig toolchain, used by scripts/probe-zig-toolchain.sh to verify the compiler
# works at all before committing to a multi-hour LLVM build.
# ---------------------------------------------------------------------------
[feature.zig-probe]
# win-arm64 is excluded deliberately, and for two independent reasons:
#   1. conda-forge publishes no `zig_win-arm64` into the win-arm64 subdir, and
#   2. conda-forge has no `cmake` for win-arm64 at all.
# Either one alone makes a native win-arm64 build impossible; it is cross-only,
# hosted on win-64. See docs/05-platform-matrix.md.
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[feature.zig-probe.dependencies]
cmake = ">=3.28"
ninja = "*"

[feature.zig-probe.target.linux-64.dependencies]
"zig_linux-64" = "0.16.*"
"sysroot_linux-64" = "2.28.*"

[feature.zig-probe.target.linux-aarch64.dependencies]
"zig_linux-aarch64" = "0.16.*"
"sysroot_linux-aarch64" = "2.28.*"

[feature.zig-probe.target.osx-64.dependencies]
"zig_osx-64" = "0.16.*"

[feature.zig-probe.target.osx-arm64.dependencies]
"zig_osx-arm64" = "0.16.*"

[feature.zig-probe.target.win-64.dependencies]
"zig_win-64" = "0.16.*"
# The win-arm64 cross toolchain is published into the win-64 subdir, so it is
# installed *here*, on the win-64 host. There is deliberately no
# [feature.zig-probe.target.win-arm64.dependencies] table: conda-forge ships no
# zig_win-arm64 for the win-arm64 subdir, so win-arm64 cannot host its own
# build. See docs/05-platform-matrix.md.
"zig_win-arm64" = "0.16.*"

# Stage 0 tasks live on the feature, so `pixi run probe` automatically selects
# the `zig-probe` environment (tasks under a plain `[tasks]` table can only run
# in the default environment, which has no compiler in it).
[feature.zig-probe.tasks]
probe = { cmd = "bash scripts/probe-zig-toolchain.sh", description = "Stage 0: verify the conda-forge zig toolchain compiles C/C++/CMake" }
probe-win = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/probe-zig-toolchain.ps1", description = "Stage 0 on Windows" }

[environments]
zig-probe = ["zig-probe"]

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
[tasks]

# --- stages 1-3: package builds -----------------------------------------------
#
# Standalone rattler-build (scripts/rb-stage.sh / .bat), NOT `pixi publish`.
# Decision 2026-09-18 (docs/06, docs/10): the pixi path reads variants only
# from the manifest's [workspace.build-variants] tables (measured: those do
# reproduce the standalone build hash exactly) — never from
# recipe/variants.yaml, and a `--variant-config` file loses to pixi's derived
# c_stdlib_version (= the platform's __glibc/__osx virtual package, defaults
# 2.28 / 13.0). Rather than keep variants.yaml and TOML tables in sync, the
# recipe's variants.yaml is the single source and every build — native,
# cross, CI — goes through standalone rattler-build, followed by the
# check-stdlib-floor.py tripwire. `--output-dir` gets indexed, so
# publish-crossbuilt.py just copies the result into ./channel.
#
# RB_OUT: where work trees and packages land (on gamma this must be on /data).
build-llvm = { cmd = "bash scripts/rb-stage.sh llvm-zig", description = "Stage 1: build llvm-zig (llvm + mlir + clang) with zig via standalone rattler-build" }
build-lld = { cmd = "bash scripts/rb-stage.sh lld-zig", description = "Stage 1.5: build standalone lld-zig against llvm-zig (flang's runtime linker)" }
build-flang = { cmd = "bash scripts/rb-stage.sh flang-zig", description = "Stage 2: build flang-zig against llvm-zig" }
build-flang-rt = { cmd = "bash scripts/rb-stage.sh flang-rt-zig", description = "Stage 3: build flang-rt-zig with the stage-2 flang" }

build-all = { depends-on = ["build-llvm", "build-lld", "build-flang", "build-flang-rt"], description = "Run stages 1-3 in order" }


# --- win-arm64: cross only, hosted on a win-64 machine ------------------------
# Same script with a target: `bash scripts/rb-stage.sh llvm-zig win-arm64`
# (kappa keeps rb-arm.bat doing the same). The win-64 chain must exist in
# ./channel first (tblgen + the Fortran compiler for the arm64 runtime).
build-llvm-winarm = { cmd = "bash scripts/rb-stage.sh llvm-zig win-arm64", description = "Stage 1 for win-arm64, cross-built from win-64" }
build-lld-winarm = { cmd = "bash scripts/rb-stage.sh lld-zig win-arm64", description = "Stage 1.5 for win-arm64, cross-built from win-64" }
build-flang-winarm = { cmd = "bash scripts/rb-stage.sh flang-zig win-arm64", description = "Stage 2 for win-arm64, cross-built from win-64" }
build-flang-rt-winarm = { cmd = "bash scripts/rb-stage.sh flang-rt-zig win-arm64", description = "Stage 3 for win-arm64, cross-built from win-64" }
build-all-winarm = { depends-on = ["build-llvm-winarm", "build-lld-winarm", "build-flang-winarm", "build-flang-rt-winarm"], description = "Cross-build all stages for win-arm64 (run on a win-64 host, after build-all)" }

# --- end-to-end checks --------------------------------------------------------
smoke = { cmd = "bash scripts/smoke-test.sh", description = "Install flang from ./channel and compile tests/*.f90 with it" }

# The gate before wiring this compiler into r-zig-pixi: do `zig cc` and our
# flang agree about calling conventions? Catches the silently-wrong-numbers
# failure mode that a smoke test cannot. Run inside an env that has both.
abi-probe = { cmd = "bash scripts/abi-probe.sh", description = "Mixed zig-cc + flang ABI probe (complex*16, hidden char lengths, byref arrays)" }

# --- housekeeping -------------------------------------------------------------
clean = { cmd = "rm -rf channel output .pixi/bld packages/*/.pixi/bld", description = "Remove build outputs and intermediate build dirs" }

# Windows: the same stages through the cmd twin of rb-stage.sh (kappa's SYSTEM
# tasks call `pixi run build-*` from the repo dir).
[target.win-64.tasks]
build-llvm = { cmd = "scripts\\rb-stage.bat llvm-zig", description = "Stage 1 (win-64)" }
build-lld = { cmd = "scripts\\rb-stage.bat lld-zig", description = "Stage 1.5 (win-64)" }
build-flang = { cmd = "scripts\\rb-stage.bat flang-zig", description = "Stage 2 (win-64)" }
build-flang-rt = { cmd = "scripts\\rb-stage.bat flang-rt-zig", description = "Stage 3 (win-64)" }
build-llvm-winarm = { cmd = "scripts\\rb-stage.bat llvm-zig win-arm64", description = "Stage 1 for win-arm64, cross" }
build-lld-winarm = { cmd = "scripts\\rb-stage.bat lld-zig win-arm64", description = "Stage 1.5 for win-arm64, cross" }
build-flang-winarm = { cmd = "scripts\\rb-stage.bat flang-zig win-arm64", description = "Stage 2 for win-arm64, cross" }
build-flang-rt-winarm = { cmd = "scripts\\rb-stage.bat flang-rt-zig win-arm64", description = "Stage 3 for win-arm64, cross" }

