# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Stage 1.5 — lld-zig
#
# Standalone lld so that flang-zig's runtime closure is ~1.2 GiB instead of
# ~3.9 GiB. flang's driver invokes exactly one llvm-zig tool at use time:
# ld.lld (verified empirically — see docs/10-status-log.md, 2026-08-25).
#
# llvm-zig is a HOST dependency (2026-08-28 rework): host deps resolve for
# the TARGET platform, which is what makes cross builds (win-arm64 — the
# platform with no native toolchain at all) produce a genuine target-arch
# lld. This was previously impossible: llvm-zig used to ship its own
# bin/lld, and a host-dep install would clobber those same paths, making
# rattler-build attribute every file to the host package (the empty-package
# trap, docs/10). llvm-zig build 1+ no longer ships lld (project removed),
# so the collision is gone and one uniform recipe serves native and cross.
#
# SLIMMING (same rework): only bin/ ships. lld's install also lays down
# liblld*.a + include/lld + lib/cmake/lld (~230 MiB) that nothing consumes
# at runtime — build scripts delete them before packaging.

context:
  version: "23.1.1"

package:
  name: lld-zig
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: 851b3d701a4fbdd9f69536d4acda578469e810ca7056687d6556443f5fd39557

build:
  # 1: rebuilt against the X86;AArch64 llvm-zig (2026-08-27). The build-string
  # hash does NOT change when only build-dep content changes (the spec string
  # is the hash input, not the resolved package), so without this bump the
  # rebuilds collide with the old filenames ("already exists" skip) and the
  # channel would keep pre-cross-capable binaries. Higher build number also
  # makes the solver prefer these over any stale build 0 still in a channel.
  # 2: rebuilt against the lld-less llvm-zig (build 1); lld-zig also
  # reworked to a host-dep recipe with cross support + binary-only payload.
  # 4: Windows alias exes hardlink-deduplicated too (build 3 did unix
  # symlinks only); vc/vc14_runtime export ignores.
  # 5: rebuilt for the zig-feedstock glibc-baseline incident + resilience
  # work: explicit glibc floor in the zig target, ceiling tripwire,
  # zig-toolchain record file, zig pinned to exact version. See docs/13.
  # 6: glibc floor LOWERED to 2.17 (CentOS 7 era) — supporting old Linux
  # servers is a project goal; c_stdlib_version + ZIG_GLIBC_FLOOR moved
  # together. Ceiling tripwire now enforces <=2.17. See docs/13.
  # 0: LLVM 23.1.1 generation (2026-09-17). Decision: the 22.1.8 chain is
  # never published (prefix.dev storage); 23.x is the first published
  # generation. Build numbers restart at 0 with the new version.
  # 1: rebuilt with standalone rattler-build so variants.yaml is honoured —
  #    the pixi-built linux-64/osx-arm64 packages carried the backend's
  #    default run exports (__glibc >=2.28 / __osx >=13.0); see docs/10
  #    2026-09-18. Higher number = solvers prefer the corrected files.
  # 2: win-arm64 rebuild with an aarch64 setjmp shim — a misdiagnosis of the
  #    0xC0000139 load failure; still broken there, superseded by 3.
  # 3: win-arm64 rebuild redirecting __C_specific_handler from KERNEL32
  #    (no such export on arm64 Windows) to the UCRT via libcompat_arm64.a on
  #    every link (docs/10 2026-09-19). Other subdirs stay at their previous
  #    build number — they were unaffected.
  # 4: static libc++ on every subdir (ZIG_LIB_DIR mirror, docs/16); macOS
  #    drops the libcxx dependency. Only osx-arm64/osx-64 were rebuilt.
  # 5: FIRST ALIGNED RELEASE (2026-10-06, docs/13 rule): all three
  #    consumer packages rebuilt on ALL SIX subdirs at one number each
  #    (lld-zig 5 / flang-zig 6 / flang-rt-zig 10; llvm-zig 4 build-only),
  #    still zig 0.16.0 / LLVM 23.1.1 — r-zig-pixi's final 0.16 release
  #    before any 0.17 work. Carries: load-dependency allowlist tripwires
  #    (docs/18 §6.6), hand-declared __glibc/__osx floors in run (docs/18
  #    §6.3; fixes the floor missing on the linux-aarch64 packages),
  #    and the allowlist-checked lld binary. Nothing else changed.
  # NEXT: 6 — the zig 0.17 wave (or the upstream-zig switch, docs/19 §6):
  #    again one number on all six subdirs (lld-zig 6 / flang-zig 7 /
  #    flang-rt-zig 11 / llvm-zig 5); scripts/build-alignment.json
  #    `next_release`. Hotfixes between releases: docs/14 + the JSON.
  number: 5
  string: zig_${{ hash }}_${{ build_number }}
  script:
    file: build

requirements:
  build:
    # win-arm64 cross: zig_win-arm64's x64-hosted zig crashes with "Illegal
    # instruction" on the build host; zig is natively a cross-compiler, so
    # use the proven zig_win-64 — build scripts pass
    # --target=aarch64-windows-gnu explicitly.
    - if: target_platform == "win-arm64"
      then:
        - zig_win-64 0.16.*
    # linux-aarch64 cross from linux-64: same hosted-cross story as
    # win-arm64 — use the build platform's proven zig; the build scripts'
    # glibc-floor block keys off target_platform and passes
    # --target=aarch64-linux-gnu.<floor> explicitly.
    - if: target_platform == "linux-aarch64" and build_platform == "linux-64"
      then:
        - zig_linux-64 0.16.0.*
    - if: target_platform != "win-arm64" and (target_platform != "linux-aarch64" or build_platform == "linux-aarch64")
      then:
        - ${{ compiler('zig') }}
    - ${{ stdlib('c') }}
    - cmake >=3.28
    - ninja
    - python
    # Cross builds only: lld's few tablegen steps must run natively.
    # NOTE: `build_platform != target_platform` never fires through the
    # pixi-build backend (it reports build == target even for cross);
    # condition on the concrete cross target instead.
    - if: build_platform != target_platform
      then:
        - llvm-zig ==${{ version }}
  host:
    # Target-platform LLVM: LLVMConfig.cmake + the static archives lld links.
    # See the header comment for why host (cross support) is now safe.
    - llvm-zig ==${{ version }}
    # No libcxx on any platform since 2026-09-30: libc++ is zig's, static, on
    # every subdir (ZIG_LIB_DIR mirror in build.sh; docs/16).
  run:
    # Hand-declared C-library floors (docs/18 §6.3, release 2026-10-06): the
    # stdlib run export reached linux-64 but not the cross-built
    # linux-aarch64 packages (they declared no __glibc at all), so the floor
    # is written here explicitly on every subdir. Values = c_stdlib_version
    # (variants.yaml): glibc 2.17, macOS 11.0. Nothing on Windows (UCRT).
    - if: linux
      then:
        - __glibc >=${{ c_stdlib_version }},<3.0.a0
    - if: osx
      then:
        - __osx >=${{ c_stdlib_version }}
  run_exports:
    weak:
      - ${{ pin_subpackage('lld-zig', upper_bound='x.x') }}
  # CRITICAL, learned the hard way: llvm-zig's STRONG run_exports means that
  # even as a *build* dep it injects itself into the HOST env (that is what
  # strong exports do). First build without this: llvm-zig materialized in
  # $PREFIX, lld's install overwrote llvm-zig-owned paths (bin/lld,
  # liblld*.a, include/lld), rattler-build attributed every file to the host
  # package, and the result was a 15.9 KiB package with ZERO content files —
  # whose test still passed, because the same strong export had put llvm-zig
  # (and its bin/lld) into the test env too. See docs/10-status-log.md.
  ignore_run_exports:
    from_package:
      - llvm-zig
    # vs2022 runtime chain: irrelevant for MinGW targets, breaks win-arm64
    # solves (no ucrt in conda-forge's win-arm64 subdir).
    by_name:
      - ucrt
      - vs2022_runtime
      # The vs2022 chain's ACTUAL export names (ucrt/vs2022_runtime above
      # were guesses that missed): these landed in the first win-arm64 llvm
      # package's depends. Meaningless for MinGW targets.
      - vc
      - vc14_runtime

tests:
  - script:
      - if: unix
        then:
          - test -x "${PREFIX}/bin/lld"
          - test -x "${PREFIX}/bin/ld.lld"
          - "${PREFIX}/bin/ld.lld --version"
      - if: win
        then:
          - if not exist %LIBRARY_BIN%\lld.exe exit 1
          - if not exist %LIBRARY_BIN%\lld-link.exe exit 1
          - '%LIBRARY_BIN%\lld-link.exe /help > nul'

about:
  homepage: https://lld.llvm.org
  license: Apache-2.0 WITH LLVM-exception
  license_file: lld/LICENSE.TXT
  summary: LLVM lld linker built with the conda-forge zig toolchain
  description: |
    Standalone lld from the same LLVM tree as llvm-zig/flang-zig, packaged
    separately so flang-zig can depend on a small linker at runtime instead
    of the full llvm-zig development tree.
  repository: https://github.com/llvm/llvm-project

extra:
  recipe-maintainers:
    - luciorq
