# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Stage 3 — flang-rt-zig
#
# The Fortran runtime. Since LLVM 21 this lives in `flang-rt` and is built as an
# LLVM *runtime* (from the `runtimes/` directory), not as a project — the same
# structure conda-forge/flang-rt-feedstock uses.
#
# The bootstrap: flang-rt is partly written in Fortran, so building it needs a
# Fortran compiler. That compiler is the stage-2 flang, pulled in as a build
# dependency. This is why the three stages cannot be collapsed into one CMake
# invocation without an in-tree bootstrap.
#
# Build history and per-platform status: docs/10-status-log.md.

context:
  version: "23.1.1"
  major: "23"

package:
  name: flang-rt-zig
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: 851b3d701a4fbdd9f69536d4acda578469e810ca7056687d6556443f5fd39557

build:
  # 1: rebuilt against the X86;AArch64 llvm-zig (2026-08-27). The build-string
  # hash does NOT change when only build-dep content changes (the spec string
  # is the hash input, not the resolved package), so without this bump the
  # rebuilds collide with the old filenames ("already exists" skip) and the
  # channel would keep pre-cross-capable binaries. Higher build number also
  # makes the solver prefer these over any stale build 0 still in a channel.
  # 2: rebuilt against the lld-less llvm-zig (build 1); lld-zig also
  # reworked to a host-dep recipe with cross support + binary-only payload.
  # 4: rebuilt for the zig-feedstock glibc-baseline incident + resilience
  # work: explicit glibc floor in the zig target, ceiling tripwire,
  # zig-toolchain record file, zig pinned to exact version. See docs/13.
  # 5: glibc floor LOWERED to 2.17 (CentOS 7 era) — supporting old Linux
  # servers is a project goal; c_stdlib_version + ZIG_GLIBC_FLOOR moved
  # together. Ceiling tripwire now enforces <=2.17. See docs/13.
  # 0: LLVM 23.1.1 generation (2026-09-17). Decision: the 22.1.8 chain is
  # never published (prefix.dev storage); 23.x is the first published
  # generation. Build numbers restart at 0 with the new version.
  # 1: LLVM 23 moved the intrinsic .mod files into flang-rt's resource dir
  #    under a driver-triple-named directory; flang.cfg now passes
  #    -fintrinsic-modules-path and flang-rt-zig normalises the dir name.
  # 2: Windows only in practice — build.bat's finclude rename never ran (cmd
  #    for /d + mid-path wildcard) and cross builds left lib\<build-host
  #    triple>; both normalised now. Unix packages at build 1 are correct.
  # 3: rebuilt with standalone rattler-build (variants honoured); see
  #    lld-zig recipe and docs/10 2026-09-18.
  # 4: OpenMP support — ships the omp_lib Fortran module (all platforms) and,
  #    on Windows, libomp.dll.a + libatomic.a link shims; llvm-openmp becomes
  #    a run dependency (host on win). docs/10 2026-09-18.
  # 5: build.sh derived the finclude rename from CONDA_TOOLCHAIN_HOST, unset
  #    on cross/Rosetta builds → linux-aarch64 and osx-64 build 4 shipped the
  #    build-host directory name and no omp_lib (GHA run 35443411628).
  #    Only those two subdirs are rebuilt at 5; the others stay correct at 4.
  # 6: win-arm64 rebuild with an aarch64 setjmp shim — a misdiagnosis of the
  #    0xC0000139 load failure; still broken there, superseded by 7.
  # 7: win-arm64 rebuild redirecting __C_specific_handler from KERNEL32
  #    (no such export on arm64 Windows) to the UCRT via libcompat_arm64.a on
  #    every link (docs/10 2026-09-19). Other subdirs stay at their previous
  #    build number — they were unaffected.
  number: 7
  string: zig_${{ hash }}_${{ build_number }}
  script:
    file: build
  # macOS: upstream flang-rt has no macOS support story yet and conda-forge
  # skips flang entirely on osx. We do NOT skip here — proving or disproving
  # macOS is one of the stated goals of this project (docs/01-goals-and-scope.md)
  # — but expect this to be the stage that fails first.
  # To skip while iterating on linux/windows, uncomment:
  # skip:
  #   - match(target_platform, "osx-*")

requirements:
  build:
    # win-arm64 cross: zig_win-arm64's x64-hosted zig crashes with "Illegal
    # instruction" on the build host; zig is natively a cross-compiler, so
    # use the proven zig_win-64 — build scripts pass
    # --target=aarch64-windows-gnu explicitly.
    - if: target_platform == "win-arm64"
      then:
        - zig_win-64 0.16.*
    # linux-aarch64 cross from linux-64: same hosted-cross story as
    # win-arm64 — use the build platform's proven zig; the build scripts'
    # glibc-floor block keys off target_platform and passes
    # --target=aarch64-linux-gnu.<floor> explicitly.
    - if: target_platform == "linux-aarch64" and build_platform == "linux-64"
      then:
        - zig_linux-64 0.16.0.*
    - if: target_platform != "win-arm64" and (target_platform != "linux-aarch64" or build_platform == "linux-aarch64")
      then:
        - ${{ compiler('zig') }}
    - ${{ stdlib('c') }}
    - cmake >=3.28
    - ninja
    - python
    # The Fortran compiler that builds the runtime. In `build`, not `host`,
    # because it must execute on the build machine.
    - flang-zig ==${{ version }}
    - llvm-zig ==${{ version }}
  host:
    - llvm-zig ==${{ version }}
    # macOS only: the runtime dylib links conda-forge's libcxx dynamically
    # (zig does not bundle libc++ statically on osx). See docs/10-status-log.md.
    - if: osx
      then:
        - libcxx
    # Windows: libomp.dll's export table is turned into a MinGW import
    # library at build time (see build.bat, OpenMP section).
    - if: win
      then:
        - llvm-openmp
  run:
    # libcxx has no run_exports of its own — must be explicit (see flang-zig).
    - if: osx
      then:
        - libcxx >=21
    # OpenMP runtime for `flang -fopenmp` (all platforms): conda-forge's
    # libomp — the same one zig cc / zig c++ code in r-zig-pixi links, so a
    # process never carries two OpenMP runtimes. We ship only the Fortran
    # module (omp_lib) and, on Windows, the link shims. docs/10 2026-09-18.
    - llvm-openmp
  # flang-rt is pure link-time input (static archive + runtime .so) — nothing
  # in it invokes llvm-zig tools at use time, and the lld-zig split's
  # amputation test (docs/10-status-log.md, 2026-08-25) ran fine without any
  # llvm-zig files present. llvm-zig's strong run_export would re-add the
  # ~3 GiB dependency; consumers get their linker via flang-zig -> lld-zig.
  ignore_run_exports:
    from_package:
      - llvm-zig
    # vs2022 runtime chain: irrelevant for MinGW targets, breaks win-arm64
    # solves (no ucrt in conda-forge's win-arm64 subdir).
    by_name:
      - ucrt
      - vs2022_runtime
      # The vs2022 chain's ACTUAL export names (ucrt/vs2022_runtime above
      # were guesses that missed): these landed in the first win-arm64 llvm
      # package's depends. Meaningless for MinGW targets.
      - vc
      - vc14_runtime
  run_constraints:
    # Guard rail: the ancient PGI-derived `libflang` and conda-forge's
    # libstdc++-built `libflang-rt` are both ABI-incompatible with this one.
    - libflang <0.0a0
    - libflang-rt <0.0a0

tests:
  - script:
      - if: unix
        then:
          # Layout matches upstream: the runtime installs into the clang
          # resource directory under a target-specific subdirectory, and we
          # additionally expose it at $PREFIX/lib. See build.sh.
          - test -f "${PREFIX}/lib/libflang_rt.runtime.a"
      - if: win
        then:
          # The runtime lives in the clang resource dir under the target
          # triple (lib\clang\<major>\lib\<arch>-w64-windows-gnu\), MinGW
          # naming. `where /r` because cmd's `if exist` cannot take a wildcard
          # mid-path. (The old top-level `flang_rt.runtime.static.lib` check
          # cannot hold for this layout — no build ever shipped that file —
          # yet it went unnoticed through every `pixi publish` build; the
          # first standalone rattler-build test run caught it.)
          - where /r "%LIBRARY_LIB%\clang" libflang_rt.runtime.a
          - where /r "%LIBRARY_LIB%\clang" omp_lib.mod
          - if not exist "%LIBRARY_PREFIX%\x86_64-w64-mingw32\lib\libomp.dll.a" if not exist "%LIBRARY_PREFIX%\aarch64-w64-mingw32\lib\libomp.dll.a" exit 1

  # The real proof: compile AND link AND run a Fortran program.
  - script:
      - if: unix
        then:
          # macOS: flang's Darwin driver needs the SDK to find libSystem at
          # link time and honours SDKROOT like clang; the test env does not
          # always carry one (seen on the osx-64 Rosetta build: "ld: library
          # 'System' not found"). Same resolution as scripts/smoke-test.sh.
          - if [ "$(uname -s)" = Darwin ] && [ -z "${SDKROOT:-}" ]; then export SDKROOT="$(xcrun --show-sdk-path)"; fi
          - flang hello.f90 -o hello
          - ./hello
          # Derived types need the intrinsic __fortran_type_info module,
          # which LLVM >= 23 ships in this package's finclude dir — this is
          # the test that caught the osx-arm64 23.1.1 breakage (docs/10).
          - flang modules.f90 -o modules
          - ./modules
          # OpenMP: directives → libomp, and the omp_lib module we ship.
          - test -f "$(dirname "$(find "${PREFIX}/lib/clang" -name omp_lib.mod | head -1)")/omp_lib_kinds.mod"
          - flang -fopenmp omp_directives.f90 -o omp_directives
          - OMP_NUM_THREADS=2 ./omp_directives
          - flang -fopenmp omp_lib_use.f90 -o omp_lib_use
          - OMP_NUM_THREADS=2 ./omp_lib_use
      - if: win
        then:
          - flang.exe hello.f90 -o hello.exe
          - hello.exe
          - flang.exe modules.f90 -o modules.exe
          - modules.exe
          - flang.exe -fopenmp omp_directives.f90 -o omp_directives.exe
          - set OMP_NUM_THREADS=2
          - omp_directives.exe
          - flang.exe -fopenmp omp_lib_use.f90 -o omp_lib_use.exe
          - omp_lib_use.exe
    requirements:
      run:
        - flang-zig ==${{ version }}
    files:
      recipe:
        - hello.f90
        - modules.f90
        - omp_directives.f90
        - omp_lib_use.f90

about:
  homepage: https://flang.llvm.org
  license: Apache-2.0 WITH LLVM-exception
  license_file: flang/LICENSE.TXT
  summary: Fortran runtime library for flang-zig
  repository: https://github.com/llvm/llvm-project

extra:
  recipe-maintainers:
    - luciorq
