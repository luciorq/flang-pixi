# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Stage 2 — flang-zig
#
# LLVM Flang, built *standalone* (out of tree) against the stage-1 llvm-zig
# install, exactly the way conda-forge/flang-feedstock builds against
# llvmdev/clangdev/mlir — but with zig as the C/C++ compiler and with our own
# LLVM instead of conda-forge's, because of the libc++/libstdc++ ABI split
# documented in docs/02-architecture-decisions.md.
#
# The Fortran runtime is deliberately excluded here (FLANG_INCLUDE_RUNTIME=OFF).
# It cannot be built in this stage anyway: compiling flang-rt requires a working
# Fortran compiler, which is the thing this stage produces. Stage 3 closes that
# loop.
#
# NOT YET COMPILED. See docs/10-status-log.md.

context:
  version: "22.1.8"
  major: "22"

package:
  name: flang-zig
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: ad18b70e287954c3d62bc7e0b86e7b7af2adf87bcfce21c15fe717f101d7aace

build:
  # 1: rebuilt against the X86;AArch64 llvm-zig (2026-08-27). The build-string
  # hash does NOT change when only build-dep content changes (the spec string
  # is the hash input, not the resolved package), so without this bump the
  # rebuilds collide with the old filenames ("already exists" skip) and the
  # channel would keep pre-cross-capable binaries. Higher build number also
  # makes the solver prefer these over any stale build 0 still in a channel.
  # 2: rebuilt against the lld-less llvm-zig (build 1); lld-zig also
  # reworked to a host-dep recipe with cross support + binary-only payload.
  number: 2
  string: zig_${{ hash }}_${{ build_number }}
  script:
    env:
      FLANG_PARALLEL_COMPILE_JOBS: ${{ flang_parallel_compile_jobs }}
    file: build

requirements:
  build:
    # win-arm64 cross: zig_win-arm64's x64-hosted zig crashes with "Illegal
    # instruction" on the build host; zig is natively a cross-compiler, so
    # use the proven zig_win-64 — build scripts pass
    # --target=aarch64-windows-gnu explicitly.
    - if: target_platform == "win-arm64"
      then:
        - zig_win-64 0.16.*
      else:
        - ${{ compiler('zig') }}
    - ${{ stdlib('c') }}
    - cmake >=3.28
    # conda-forge pins `ninja <1.13` for flang because of a Windows path-escaping
    # bug (a `...\tools` path being read as a tab). Mirrored here.
    - ninja <1.13
    - python
    # Cross builds (win-64 -> win-arm64) need llvm-tblgen / mlir-tblgen /
    # clang-tblgen as native executables.
    # NOTE: `build_platform != target_platform` never fires through the
    # pixi-build backend (it reports build == target even for cross);
    # condition on the concrete cross target instead.
    - if: target_platform == "win-arm64"
      then:
        - llvm-zig ==${{ version }}
  host:
    # Stage 1. The `==` pin is not cosmetic: flang links LLVM/MLIR/Clang static
    # archives and shares headers with them; a version skew is an immediate
    # link failure at best.
    - llvm-zig ==${{ version }}
    # macOS only: zig links conda-forge's libcxx dynamically there (no static
    # bundling like Linux); its run_exports adds the runtime constraint.
    # Paired with -Wl,-rpath,$PREFIX/lib in build.sh. See docs/10-status-log.md.
    - if: osx
      then:
        - libcxx
  run:
    # The ONLY stage-1 tool flang invokes at runtime is ld.lld — proven by
    # deleting every llvm-zig file except bin/lld from a working env and
    # watching compile+link+run (exe AND shared) still succeed. Everything
    # else flang reads at use time (ISO_Fortran_binding.h, the runtime libs)
    # ships in flang-zig/flang-rt-zig themselves. So the runtime dep is the
    # 56 MiB lld-zig, not the ~3 GiB llvm-zig (which stays build/host-only).
    # See docs/10-status-log.md (2026-08-25).
    - lld-zig ==${{ version }}
    # Explicit, learned the hard way: conda-forge's libcxx has NO run_exports
    # on itself, so a host dep alone adds nothing to run and flang-22 aborts
    # at load with "Library not loaded: @rpath/libc++.1.dylib" (caught by the
    # first osx-arm64 smoke). See docs/10-status-log.md.
    - if: osx
      then:
        - libcxx >=21
    # flang's own driver does independent, GCC-style sysroot/CRT-object
    # discovery at link time (it is a Clang-derived driver, not `zig cc` —
    # zig's bundled-libc trick doesn't apply here). flang.cfg points
    # `--sysroot` at `<CFGDIR>/../${target_platform's conda triple}/sysroot`,
    # the same convention conda-forge's clangdev/flang.cfg use — but unlike
    # conda-forge, we never made the sysroot itself a runtime dependency, so
    # outside the build sandbox that path resolved to nothing and linking any
    # program failed with "cannot find Scrt1.o" / "-lc" / "-lgcc" etc. Found
    # via `pixi run smoke`'s first real link+run of our own flang; see
    # docs/10-status-log.md.
    - if: linux
      then:
        - sysroot_${{ target_platform }} >=${{ c_stdlib_version }}
  run_exports:
    weak:
      - ${{ pin_subpackage('flang-zig', upper_bound='x.x') }}
  # llvm-zig's STRONG run_export would silently re-add the ~3 GiB runtime
  # dependency this recipe just replaced with lld-zig. llvm-zig stays a
  # host/build-time input only.
  ignore_run_exports:
    from_package:
      - llvm-zig
    # vs2022 runtime chain: irrelevant for MinGW targets, breaks win-arm64
    # solves (no ucrt in conda-forge's win-arm64 subdir).
    by_name:
      - ucrt
      - vs2022_runtime
      # The vs2022 chain's ACTUAL export names (ucrt/vs2022_runtime above
      # were guesses that missed): these landed in the first win-arm64 llvm
      # package's depends. Meaningless for MinGW targets.
      - vc
      - vc14_runtime

tests:
  - script:
      - if: unix
        then:
          - test -f "${PREFIX}/bin/flang"
          - "${PREFIX}/bin/flang --version"
          # Deliberately does NOT link: there is no Fortran runtime until
          # stage 3. This only proves the frontend parses, semantically
          # analyses, and lowers through MLIR to LLVM IR.
          - "${PREFIX}/bin/flang -S -emit-llvm hello.f90 -o hello.ll"
          - grep -q "define" hello.ll
      - if: win
        then:
          - if not exist %LIBRARY_BIN%\flang.exe exit 1
          - "%LIBRARY_BIN%\\flang.exe --version"
          - "%LIBRARY_BIN%\\flang.exe -S -emit-llvm hello.f90 -o hello.ll"
    files:
      recipe:
        - hello.f90

about:
  homepage: https://flang.llvm.org
  license: Apache-2.0 WITH LLVM-exception
  license_file: flang/LICENSE.TXT
  summary: LLVM Flang Fortran compiler driver, built with the conda-forge zig toolchain
  description: |
    The `flang` driver and its supporting libraries, built out-of-tree against
    llvm-zig. Contains no Fortran runtime — install flang-rt-zig for that.
  repository: https://github.com/llvm/llvm-project

extra:
  recipe-maintainers:
    - luciorq
