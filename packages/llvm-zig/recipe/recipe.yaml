# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Stage 1 — llvm-zig
#
# LLVM core + MLIR + Clang + LLD built entirely with `zig cc` / `zig c++`.
#
# WHY WE BUILD LLVM OURSELVES INSTEAD OF USING conda-forge llvmdev/clangdev/mlir:
#   `zig c++` statically links its own bundled libc++ and *strips* any
#   `-stdlib=` flag handed to it (see the conda-forge zig wrapper,
#   recipe/scripts/_zig-cc-common.sh). conda-forge's llvmdev/clangdev/mlir are
#   built against libstdc++ (Linux) / MSVC STL (Windows). Those C++ ABIs are
#   mutually incompatible — std::string alone has a different layout and
#   different mangling. So a zig-built flang cannot link conda-forge's LLVM.
#   See docs/02-architecture-decisions.md for the full argument and the
#   experiment that established it.
#
# NOTHING IN THIS RECIPE HAS BEEN COMPILED YET. Treat every CMake flag as a
# reasoned starting point, not a verified fact. docs/10-status-log.md tracks
# what has actually been run.

context:
  version: "23.1.1"
  major: "23"
  # Projects enabled in the stage-1 tree.
  #   clang : flang links clangBasic/clangDriver/clangFrontend, and the clang
  #           driver gives us a working linker driver at runtime.
  #   mlir  : flang's code generation is MLIR-based. Non-negotiable.
  # lld was REMOVED (2026-08-28): the linker is lld-zig's job now (built
  # standalone against this package). Dropping the project makes stage 1
  # faster/smaller AND eliminates the bin/lld same-path collision that
  # previously forced lld-zig to take llvm-zig as a build dep — which is
  # what blocked win-arm64 cross-builds of the linker.
  llvm_projects: "clang;mlir"

package:
  name: llvm-zig
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  # Cross-checked against conda-forge/flang-feedstock and
  # conda-forge/flang-rt-feedstock, which both pin this same tarball.
  sha256: 851b3d701a4fbdd9f69536d4acda578469e810ca7056687d6556443f5fd39557

build:
  # 2: build 1 accidentally STILL shipped bin/lld — reused work-dir build
  # trees keep LLVM_TOOL_LLD_BUILD=ON in the stale CMake cache even after
  # LLVM_ENABLE_PROJECTS drops lld. Now forced OFF explicitly on the cmake
  # command line (cache-proof).
  # 3: build 2 STILL shipped lld via the stale work-dir build tree; the
  # build scripts now delete build/ before configure. See docs/10.
  # 4: the REAL leak was the reused host prefix carrying previous
  # generations' installed lld files into the package; build scripts now
  # purge them pre-configure. See docs/10.
  # 5: LLVM_HAS_LOGF128=OFF — the zig-feedstock 13→15 glibc-baseline flip
  # made build-4 archives (logf128 detected under 13) unlinkable under 15.
  # 6: explicit glibc floor in the zig target (x86_64-linux-gnu.2.17) +
  # build-time ceiling check + zig-toolchain record file. See docs/13.
  # 7: glibc floor LOWERED to 2.17 (CentOS 7 era) — supporting old Linux
  # servers is a project goal; c_stdlib_version + ZIG_GLIBC_FLOOR moved
  # together. Ceiling tripwire now enforces <=2.17. See docs/13.
  # 0: LLVM 23.1.1 generation (2026-09-17). Decision: the 22.1.8 chain is
  # never published (prefix.dev storage); 23.x is the first published
  # generation. Build numbers restart at 0 with the new version.
  # 1: win-arm64 rebuild with an aarch64 setjmp shim — a misdiagnosis of the
  #    0xC0000139 load failure; still broken there, superseded by 2.
  # 2: win-arm64 rebuild redirecting __C_specific_handler from KERNEL32
  #    (no such export on arm64 Windows) to the UCRT via libcompat_arm64.a on
  #    every link (docs/10 2026-09-19). Other subdirs stay at their previous
  #    build number — they were unaffected.
  number: 2
  # `zig_` prefix in the build string is a deliberate warning label: these
  # artifacts are NOT interchangeable with conda-forge's llvm packages.
  string: zig_${{ hash }}_${{ build_number }}
  script:
    # Variant keys are surfaced to the scripts explicitly rather than relying on
    # rattler-build's implicit env export — referencing them here is also what
    # marks them as "used variants" so they participate in the build hash.
    env:
      LLVM_PROJECTS: ${{ llvm_projects }}
      LLVM_TARGETS_TO_BUILD: ${{ llvm_targets_to_build }}
      LLVM_PARALLEL_LINK_JOBS: ${{ llvm_parallel_link_jobs }}
    # No extension: rattler-build appends .sh on unix and .bat on Windows.
    file: build

requirements:
  build:
    # NOTE: `${{ compiler('zig') }}` resolves to `zig_<target_platform>` using
    # the `zig_compiler` / `zig_compiler_version` variant keys defined in
    # variants.yaml. It does NOT export CC/CXX — it exports ZIG_CC/ZIG_CXX.
    # build.sh wires those into CMake explicitly.
    #
    # For a cross build this correctly resolves to the *hosted cross-compiler*
    # package — e.g. targeting win-arm64 from a win-64 machine installs
    # `zig_win-arm64`, which is published only into the win-64 subdir.
    # win-arm64 cross: zig_win-arm64's x64-hosted zig crashes with "Illegal
    # instruction" on the build host; zig is natively a cross-compiler, so
    # use the proven zig_win-64 — build scripts pass
    # --target=aarch64-windows-gnu explicitly.
    - if: target_platform == "win-arm64"
      then:
        - zig_win-64 0.16.*
    # linux-aarch64 cross from linux-64: same hosted-cross story as
    # win-arm64 — use the build platform's proven zig; the build scripts'
    # glibc-floor block keys off target_platform and passes
    # --target=aarch64-linux-gnu.<floor> explicitly.
    - if: target_platform == "linux-aarch64" and build_platform == "linux-64"
      then:
        - zig_linux-64 0.16.0.*
    - if: target_platform != "win-arm64" and (target_platform != "linux-aarch64" or build_platform == "linux-aarch64")
      then:
        - ${{ compiler('zig') }}
    # Cross builds only: LLVM needs tblgen and friends as *native* executables
    # to generate sources during the build. Rather than have LLVM configure a
    # nested native sub-build (CROSS_TOOLCHAIN_FLAGS_NATIVE), we hand it a
    # previously built native llvm-zig via LLVM_NATIVE_TOOL_DIR. This is why
    # win-arm64 can only be built *after* win-64 — see docs/05-platform-matrix.md.
    # NOTE: `build_platform != target_platform` never fires through the
    # pixi-build backend (it reports build == target even for cross);
    # condition on the concrete cross target instead.
    - if: build_platform != target_platform
      then:
        - llvm-zig ==${{ version }}
    # On Linux this pulls sysroot_linux-64 2.17.*, which the zig wrapper
    # auto-detects at $CONDA_PREFIX/<arch>-conda-linux-gnu/sysroot and passes
    # as -isysroot. NOTE: that affects HEADERS only — it is NOT a glibc
    # symbol floor. zig links against its own generated glibc stubs, whose
    # version comes from the -target triple; the feedstock's implicit choice
    # changed under us once (2.31 → 2.17, the logf128 incident, docs/13), so
    # build.sh now pins the floor explicitly via
    # --target=<arch>-linux-gnu.2.17. Keep that in sync with c_stdlib_version.
    # 2.17 (CentOS 7 era) is a project goal: support old Linux servers.
    # On osx it pins MACOSX_DEPLOYMENT_TARGET, which the zig wrapper folds into
    # the -target triple at runtime.
    # On win it pulls vs2022 — see docs/05-platform-matrix.md, OPEN QUESTION W1.
    - ${{ stdlib('c') }}
    - cmake >=3.28
    - ninja
    - python
  host:
    # macOS only: zig links conda-forge's libcxx DYNAMICALLY there (it does
    # NOT bundle libc++ statically like on Linux — zig_impl_osx-* itself
    # depends on libcxx). Making it a real host dep lets its run_exports add
    # the runtime constraint. build.sh pairs this with -Wl,-rpath,$PREFIX/lib
    # since zig injects no LC_RPATH. See docs/10-status-log.md (2026-08-25).
    - if: osx
      then:
        - libcxx
  run:
    # libcxx has no run_exports of its own — must be explicit (see flang-zig).
    - if: osx
      then:
        - libcxx >=21
  run_exports:
    strong:
      - ${{ pin_subpackage('llvm-zig', upper_bound='x.x') }}
  # The vs2022 stdlib activation's strong run-export chain (vs2022_runtime ->
  # ucrt) is meaningless for MinGW-target packages and BREAKS the win-arm64
  # cross solve (conda-forge's win-arm64 subdir ships no ucrt).
  ignore_run_exports:
    by_name:
      - ucrt
      - vs2022_runtime
      # The vs2022 chain's ACTUAL export names (ucrt/vs2022_runtime above
      # were guesses that missed): these landed in the first win-arm64 llvm
      # package's depends. Meaningless for MinGW targets.
      - vc
      - vc14_runtime
      # The NATIVE llvm-zig build dep (cross only) carries this package's own
      # strong run-export, which would inject llvm-zig into the win-arm64
      # host solve before any win-arm64 llvm-zig exists.
      - llvm-zig

tests:
  - script:
      - if: unix
        then:
          - test -f "${PREFIX}/bin/llvm-config"
          - test -f "${PREFIX}/bin/clang"
          - test -f "${PREFIX}/bin/mlir-tblgen"
          - test -f "${PREFIX}/lib/cmake/llvm/LLVMConfig.cmake"
          - test -f "${PREFIX}/lib/cmake/clang/ClangConfig.cmake"
          - test -f "${PREFIX}/lib/cmake/mlir/MLIRConfig.cmake"
          - "${PREFIX}/bin/llvm-config --version"
      - if: win
        then:
          - if not exist %LIBRARY_BIN%\llvm-config.exe exit 1
          - if not exist %LIBRARY_BIN%\mlir-tblgen.exe exit 1
          - if not exist %LIBRARY_LIB%\cmake\mlir\MLIRConfig.cmake exit 1

about:
  homepage: https://llvm.org
  license: Apache-2.0 WITH LLVM-exception
  license_file: llvm/LICENSE.TXT
  summary: LLVM + MLIR + Clang + LLD built with the conda-forge zig toolchain
  description: |
    A zig-cc-built LLVM development tree used exclusively as the substrate for
    building LLVM Flang. It is ABI-incompatible with conda-forge's llvmdev /
    clangdev / mlir packages (zig statically links libc++; conda-forge uses
    libstdc++ / MSVC STL) and must never be co-installed as a substitute.
  repository: https://github.com/llvm/llvm-project

extra:
  recipe-maintainers:
    - luciorq
