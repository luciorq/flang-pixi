# Stage 2: flang-zig
#
# The LLVM Flang compiler driver, built standalone against the stage-1
# llvm-zig tree. The Fortran runtime is NOT built here
# (FLANG_INCLUDE_RUNTIME=OFF); that is stage 3.
#
# Stage 1 must be published to ./channel first:
#   pixi run build-llvm     # -> channel/<subdir>/llvm-zig-*.conda + repodata
#   pixi run build-flang
#
# `../../channel` is a relative local channel; pixi resolves it against this
# manifest's directory.

[workspace]
channels = ["../../channel", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64", "win-arm64"]
preview = ["pixi-build"]

[package]
name = "flang-zig"
version = "22.1.8"

[package.build]
# `backend.channels` is only where the build backend package is fetched from.
# The recipe's `llvm-zig` dependency is resolved from the [workspace] channels
# above, where `../../channel` comes first so a freshly rebuilt stage 1 wins.
backend = { name = "pixi-build-rattler-build", version = "0.4.*", channels = ["conda-forge"] }

[package.build.config]
recipe = "recipe/recipe.yaml"
